<!DOCTYPE html>
<!--
  Hayai Desk — Painel de Suporte para atendimento rápido
  Desenvolvido por: Rodrigo Won
  Ano: 2026
  Repositório: https://github.com/rodrigowon/painel-suporte.git
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hayai Desk</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── TEMA ESCURO (padrão) ──────────────────────────────── */
    :root {
      --bg:       #0f1117;
      --panel:    #181c25;
      --surface:  #1e2230;
      --border:   #2a2f42;
      --text:     #e2e6f3;
      --muted:    #6b7394;
      --accent:   #2959fa;
      --accentBg: #08133b;
      --pill:     #252a3a;
      --input:    #111520;
      --danger:   #f87171;
      /* tokens de sugestão — definidos uma vez, usados nos dois temas */
      --suggest-bg:       rgba(255,255,255,.04);
      --suggest-border:   rgba(255,255,255,.08);
      --suggest-text:     #c8cfdd;
      --suggest-bg-hov:   rgba(255,255,255,.06);
      --suggest-brd-hov:  rgba(255,255,255,.14);
      --suggest-text-hov: #d6dceb;
      --suggest-bg-act:   rgba(41,89,250,.10);
      --suggest-brd-act:  rgba(41,89,250,.28);
      --suggest-text-act: #dfe5f3;
    }

    /* ── TEMA CLARO ────────────────────────────────────────── */
    body.light {
      --bg:       #f0f2f7;
      --panel:    #ffffff;
      --surface:  #f8f9fc;
      --border:   #b4bed1;
      --text:     #1a1d2e;
      --muted:    #8b90aa;
      --accent:   #2959fa;
      --accentBg: #e3e8ff;
      --pill:     #eef0f8;
      --input:    #f8f9fc;
      --danger:   #dc2626;
      --suggest-bg:       #e9edf7;
      --suggest-border:   #c7d0e3;
      --suggest-text:     #667089;
      --suggest-bg-hov:   #dde5f3;
      --suggest-brd-hov:  #b4c0d8;
      --suggest-text-hov: #49536a;
      --suggest-bg-act:   #dfe7ff;
      --suggest-brd-act:  #9db2ff;
      --suggest-text-act: #33415c;
    }

    /* ──────────────────────────────────────────────────────────
        LAYOUT BASE
        body é o flex container principal:
        .titlebar → [#view-botoes | #view-texto] → .footer
    ─────────────────────────────────────────────────────────── */
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── TITLEBAR / REGIÃO DE DRAG ─────────────────────────── */
    .titlebar {
      -webkit-app-region: drag;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }
    .titlebar button,
    .titlebar input { -webkit-app-region: no-drag; }

    .row { display: flex; align-items: center; gap: 6px; }

    input[type="text"] {
      flex: 1;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    input[type="text"]::placeholder { color: var(--muted); }

    /* ── BOTÕES DE ÍCONE (titlebar) ────────────────────────── */
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .icon-btn:hover              { background: var(--surface); color: var(--text); }
    .icon-btn.minimize-btn:hover { background: #fbbf2422; border-color: #fbbf2455; color: #fbbf24; }
    .icon-btn.maximize-btn:hover { background: #2959fa22; border-color: #2959fa55; color: var(--accent); }
    .icon-btn.close-btn:hover    { background: #f871711a; border-color: #f8717155; color: var(--danger); }

    /* ── BOTÕES DE PERÍODO (manhã / tarde / noite) ─────────── */
    .period-row {
      display: flex;
      gap: 4px;
      padding: 8px 12px 0;
      flex-shrink: 0;
    }
    .period-btn {
      flex: 1;
      background: var(--pill);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 4px;
      padding: 5px 4px;
      font-size: 11px;
      font-weight: 400;
      transition: all .15s;
    }
    .period-btn.active-manha { background: #f59e0b22; border-color: #f59e0b66; color: #f59e0b; font-weight: 600; }
    .period-btn.active-tarde { background: #f9731622; border-color: #f9731666; color: #f97316; font-weight: 600; }
    .period-btn.active-noite { background: #818cf822; border-color: #818cf866; color: #818cf8; font-weight: 600; }

    /* ── VIEWS (área central — apenas uma visível por vez) ──── */
    #view-botoes,
    #view-texto {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #view-texto { display: none; }

    /* ── LISTA DE MENSAGENS (modo botões) ──────────────────── */
    #lista {
      overflow-y: auto;
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      /* centraliza o conteúdo em tela cheia sem esticar os cards */
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
    }
    #lista::-webkit-scrollbar       { width: 4px; }
    #lista::-webkit-scrollbar-track { background: transparent; }
    #lista::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* grid de 2 colunas quando há mais de 5 mensagens */
    @media (min-width: 480px) {
      #lista.two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        align-content: start;
      }
    }

    /* ── CARD DE MENSAGEM ───────────────────────────────────── */
    .card {
      background: var(--pill);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: background .12s, border-color .12s;
      min-height: 44px;
    }
    .card:hover     { background: var(--surface); border-color: var(--accent); }
    .card.copied    { background: var(--accentBg); border-color: rgba(41,89,250,.35); }
    .card.drag-over { border-color: var(--accent); background: var(--accentBg); }

    @keyframes tremer {
      0%   { transform: rotate(0deg)    scale(1.02); }
      25%  { transform: rotate(-1.5deg) scale(1.02); }
      50%  { transform: rotate(0deg)    scale(1.02); }
      75%  { transform: rotate(1.5deg)  scale(1.02); }
      100% { transform: rotate(0deg)    scale(1.02); }
    }
    .card.dragging,
    .card.shaking {
      opacity: .9;
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
      animation: tremer .25s infinite linear;
      z-index: 10;
    }

    .card-text  { flex: 1; font-size: 12px; color: var(--text); line-height: 1.35; word-break: break-word; }
    .copy-icon  { color: var(--muted); flex-shrink: 0; transition: color .15s; }
    .card.copied .copy-icon { color: var(--accent); }
    .card:hover  .copy-icon { color: var(--accent); }

    .drag-handle {
      color: var(--border);
      cursor: grab;
      padding: 2px;
      border-radius: 4px;
      display: flex; align-items: center;
      flex-shrink: 0;
      transition: color .12s;
    }
    .drag-handle:hover  { color: var(--muted); }
    .drag-handle:active { cursor: grabbing; }

    .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }

    /* ── FOOTER ─────────────────────────────────────────────── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }

    .logo-btn {
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      padding: 2px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo-btn:hover           { border-color: var(--border); background: var(--surface); }
    .logo-btn img             { width: 28px; height: 28px; object-fit: contain; border-radius: 4px; display: none; }
    .logo-btn.has-logo        { background: transparent; border-color: var(--border); }
    .logo-btn.has-logo img    { display: block; }

    .footer-spacer { flex: 1; }

    .btn-secondary {
      display: flex; align-items: center; gap: 5px;
      background: transparent; border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted); cursor: pointer;
      font-size: 12px; padding: 6px 12px; transition: all .15s;
    }
    .btn-secondary:hover { background: var(--surface); color: var(--text); }

    .btn-primary {
      display: flex; align-items: center; gap: 5px;
      background: var(--accent); border: none;
      border-radius: 8px; color: #fff; cursor: pointer;
      font-size: 12px; font-weight: 600; padding: 6px 12px;
      transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .85; }

    .settings-btn {
      display: flex; align-items: center; gap: 5px;
      background: transparent; border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted); cursor: pointer;
      font-size: 12px; padding: 6px 12px; transition: all .15s;
    }
    .settings-btn:hover  { background: var(--surface); color: var(--text); }
    .settings-btn.active { background: var(--accentBg); border-color: var(--accent); color: var(--accent); }

    /* ── MODAIS (overlay compartilhado) ─────────────────────── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      align-items: center; justify-content: center;
      z-index: 999; padding: 16px;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; width: 100%; max-width: 400px;
      max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 13px 16px; display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .modal-hint  { font-size: 11px; color: var(--muted); padding: 8px 16px 4px; flex-shrink: 0; }
    .modal-hint code { color: var(--accent); background: var(--pill); padding: 1px 4px; border-radius: 3px; }

    .modal-list {
      overflow-y: auto; flex: 1; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .modal-list::-webkit-scrollbar       { width: 4px; }
    .modal-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .modal-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .modal-card-text    { flex: 1; font-size: 13px; color: var(--text); line-height: 1.5; }
    .modal-card-actions { display: flex; gap: 4px; flex-shrink: 0; }

    .sm-btn {
      background: transparent; border: 1px solid var(--border);
      border-radius: 6px; color: var(--muted); cursor: pointer;
      display: flex; align-items: center; padding: 5px; transition: all .15s;
    }
    .sm-btn:hover        { background: var(--pill); color: var(--text); }
    .sm-btn.danger       { border-color: rgba(248,113,113,.35); color: var(--danger); }
    .sm-btn.danger:hover { background: rgba(248,113,113,.1); }
    .sm-btn.save         { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sm-btn.save:hover   { opacity: .85; }

    textarea {
      width: 100%; background: var(--input); border: 1px solid rgba(41,89,250,.35);
      border-radius: 8px; padding: 7px 10px; color: var(--text); font-size: 13px; outline: none;
      resize: vertical; min-height: 64px; font-family: inherit; box-sizing: border-box;
    }
    .edit-actions { display: flex; gap: 4px; margin-top: 6px; }
    .edit-btn {
      display: flex; align-items: center; gap: 4px;
      border-radius: 6px; cursor: pointer; font-size: 12px; padding: 5px 10px; border: none;
    }
    .edit-btn.save   { background: var(--accent); color: #fff; font-weight: 600; }
    .edit-btn.cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }

    .add-new-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 10px; padding: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; transition: all .2s;
    }
    .add-new-btn:hover  { opacity: .85; transform: translateY(-1px); }
    .add-new-btn:active { transform: translateY(0); }

    /* ── MODAL "SOBRE" ─────────────────────────────────────── */
    .info-modal {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; width: 100%; max-width: 300px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .info-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .info-row  { display: flex; align-items: center; gap: 12px; }

    .info-logo-preview {
      width: 52px; height: 52px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    .info-logo-preview img { width: 100%; height: 100%; object-fit: contain; }

    .info-app-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .info-version  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .info-dev      { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .info-divider  { border: none; border-top: 1px solid var(--border); }

    .info-link-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); cursor: pointer;
      font-size: 12px; padding: 8px 10px; transition: all .15s;
      width: 100%; text-align: left; margin-bottom: 6px;
    }
    .info-link-btn:last-child { margin-bottom: 0; }
    .info-link-btn:hover { background: var(--pill); border-color: var(--accent); color: var(--accent); }

    svg { display: block; }

    /* ──────────────────────────────────────────────────────────
        MODO DIGITAÇÃO — Smart Compose
        O input e o ghost-text compartilham exatamente os mesmos
        valores de font, padding, line-height e box-sizing para
        que o texto fantasma fique pixel-perfect alinhado.
    ─────────────────────────────────────────────────────────── */

    #view-texto {
      justify-content: center;
      align-items: center;
      padding: 0 20px;
    }

    .smart-compose-icon { margin-bottom: 16px; opacity: .7; }

    /* Container que empilha ghost (z-index 1) e input (z-index 2) */
    .smart-input-container {
      position: relative;
      width: 100%;
      max-width: 700px;
      height: 42px;
      margin: 0 auto;
    }

    .smart-input,
    .ghost-text {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      line-height: 40px;
      padding: 0 14px;
      box-sizing: border-box;
      border-radius: 8px;
      white-space: pre;
    }

    .smart-input {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      outline: none;
      z-index: 2;
      caret-color: var(--accent);
    }
    .smart-input:focus         { border-color: var(--accent); }
    .smart-input.copied-flash  { border-color: #4ade80 !important; }

    .ghost-text {
      background: var(--input);
      color: var(--muted);
      border: 1px solid transparent;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }

    /* Chips de sugestões — usam variáveis CSS para adaptar ao tema */
    .smart-suggestions {
      width: 100%;
      max-width: 700px;
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      min-height: 38px;
    }

    .smart-suggestion {
      flex: 1 1 180px;
      min-width: 0;
      max-width: 100%;
      background: var(--suggest-bg);
      border: 1px solid var(--suggest-border);
      color: var(--suggest-text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .smart-suggestion:hover  { background: var(--suggest-bg-hov);  border-color: var(--suggest-brd-hov);  color: var(--suggest-text-hov); }
    .smart-suggestion.active { background: var(--suggest-bg-act);  border-color: var(--suggest-brd-act);  color: var(--suggest-text-act); }

    /* Dica de atalho de teclado */
    .smart-hint {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      opacity: 0;
      transition: opacity .2s;
      text-align: center;
    }
    .smart-hint.visible { opacity: 1; }
    .smart-hint strong  { color: var(--text); }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
      TITLEBAR — barra de topo arrastável com nome e controles
════════════════════════════════════════════════════════════ -->
<div class="titlebar">
  <div class="row">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <input type="text" id="inp-nome" placeholder="Atendente..." oninput="salvarNome()">

    <button class="icon-btn" id="btn-dark" onclick="toggleDark()" title="Modo escuro/claro">
      <svg id="icon-dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>

    <button class="icon-btn minimize-btn" onclick="minimizar()" title="Minimizar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <button class="icon-btn maximize-btn" onclick="maximizar()" title="Maximizar / Restaurar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      </svg>
    </button>

    <button class="icon-btn close-btn" onclick="window.close()" title="Fechar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
      VIEW BOTÕES — seletor de período + lista de mensagens
════════════════════════════════════════════════════════════ -->
<div id="view-botoes">
  <div class="period-row">
    <button class="period-btn" id="btn-manha" onclick="setPeriod('manha')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      Manhã
    </button>
    <button class="period-btn" id="btn-tarde" onclick="setPeriod('tarde')">

<script>

let msgs      = [];      // array de mensagens salvas
let period    = "manha"; // período atual: manha | tarde | noite
let dark      = true;    // tema escuro ativo?
let editIdx   = null;    // índice da mensagem em edição no modal
let addingNew = false;   // campo de nova mensagem aberto no modal?
let dragSrc   = null;    // índice de origem no drag & drop
let dragEl    = null;    // elemento DOM sendo arrastado
let modoAtual = "botoes"; // modo ativo: "botoes" | "texto"

// ═══════════════════════════════════════════════════════════
// ALTERNÂNCIA DE MODO (botões ↔ digitação)
// ═══════════════════════════════════════════════════════════

/**
 * Alterna entre o modo de botões (lista de mensagens) e o modo de
 * digitação (smart compose). Atualiza o ícone e estado do botão.
 */
function toggleMode() {
  const viewBotoes = document.getElementById("view-botoes");
  const viewTexto  = document.getElementById("view-texto");
  const btnMode    = document.getElementById("btn-mode");

        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg> Botões`;
    setTimeout(() => document.getElementById("smart-input").focus(), 50);
  } else {
    modoAtual = "botoes";
    viewBotoes.style.display = "flex";
    viewTexto.style.display  = "none";
    btnMode.classList.remove("active");
    btnMode.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2" ry="2"/>
        <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/>
      </svg> Digitação`;
    // Limpa o campo ao sair do modo digitação
    clearSmartCompose();
  }
}

// ═══════════════════════════════════════════════════════════
// SMART COMPOSE — texto preditivo com fuzzy search
// ═══════════════════════════════════════════════════════════

let currentPrediction      = "";
let currentSuggestions     = [];
let currentSuggestionIndex = 0;

/** Remove acentos e converte para minúsculas para comparação normalizada */
function normalizeText(str = "") {
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

/** Divide string em tokens alfanuméricos */
function tokenize(str = "") {
  return normalizeText(str).split(/[^a-z0-9]+/i).filter(Boolean);
}

/** Algoritmo de Jaro para similaridade entre strings curtas */
function jaroSimilarity(a, b) {
  a = normalizeText(a);
  b = normalizeText(b);
  if (a === b) return 1;
  if (!a.length || !b.length) return 0;

  const matchDistance = Math.floor(Math.max(a.length, b.length) / 2) - 1;
  const aMatches = new Array(a.length).fill(false);
  const bMatches = new Array(b.length).fill(false);
  let matches = 0;

  for (let i = 0; i < a.length; i++) {
    const start = Math.max(0, i - matchDistance);
    const end   = Math.min(i + matchDistance + 1, b.length);
    for (let j = start; j < end; j++) {
      if (bMatches[j] || a[i] !== b[j]) continue;
      aMatches[i] = bMatches[j] = true;
      matches++;
      break;
    }
  }

  if (!matches) return 0;

  let k = 0, transpositions = 0;
  for (let i = 0; i < a.length; i++) {
    if (!aMatches[i]) continue;
    while (!bMatches[k]) k++;
    if (a[i] !== b[k]) transpositions++;
    k++;
  }

  return (matches / a.length + matches / b.length + (matches - transpositions / 2) / matches) / 3;
}

/** Jaro-Winkler: bônus para prefixos comuns (até 4 caracteres) */
function jaroWinkler(a, b) {
  const j = jaroSimilarity(a, b);
  a = normalizeText(a);
  b = normalizeText(b);
  let prefix = 0;
  for (let i = 0; i < Math.min(4, a.length, b.length); i++) {
    if (a[i] === b[i]) prefix++;
    else break;
  }
  return j + prefix * 0.1 * (1 - j);
}

/** Limiar mínimo de similaridade ajustado ao tamanho do termo */
function fuzzyThreshold(term) {
  if (term.length <= 2) return 1.0;
  if (term.length === 3) return 0.72;
  if (term.length === 4) return 0.70;
  if (term.length <= 6) return 0.68;
  return 0.66;
}

/** Distância de Damerau-Levenshtein (edição + transposição adjacente) */
function damerauLevenshtein(a, b) {
  a = normalizeText(a);
  b = normalizeText(b);
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        dp[i][j] = Math.min(dp[i][j], dp[i - 2][j - 2] + 1);
      }
    }
  }
  return dp[a.length][b.length];
}

/** Verifica se dois strings curtos contêm as mesmas letras (±1 diferença) */
function sameLetterBag(a, b) {
  a = normalizeText(a); b = normalizeText(b);
  if (Math.abs(a.length - b.length) > 1 || a.length > 5) return false;
  const count = s => { const m = new Map(); for (const c of s) m.set(c, (m.get(c) || 0) + 1); return m; };
  const ma = count(a), mb = count(b);
  let diff = 0;
  for (const k of new Set([...ma.keys(), ...mb.keys()])) diff += Math.abs((ma.get(k) || 0) - (mb.get(k) || 0));
  return diff <= 2;
}

/** Verifica se b é resultado de uma única transposição adjacente de a */
function isAdjacentSwap(a, b) {
  a = normalizeText(a); b = normalizeText(b);
  if (a.length !== b.length || a.length < 2 || a === b) return false;
  for (let i = 0; i < a.length - 1; i++) {
    if (a.slice(0, i) + a[i + 1] + a[i] + a.slice(i + 2) === b) return true;
  }
  return false;
}

/** Score de similaridade combinado: Jaro-Winkler + Damerau-Levenshtein */
function typoSimilarity(term, word) {
  const t = normalizeText(term), w = normalizeText(word);
  if (!t || !w) return 0;
  if (t === w) return 1;
  if (w.startsWith(t)) return 0.97;
  if (w.includes(t)) return 0.90;
  if (isAdjacentSwap(t, w)) return 0.95;
  if (Math.max(t.length, w.length) <= 5 && sameLetterBag(t, w)) return 0.90;
  const jw = jaroWinkler(t, w);
  const dl = 1 - damerauLevenshtein(t, w) / Math.max(t.length, w.length);
  return Math.max(jw, dl);
}

/** Maior score entre o termo e todos os tokens da mensagem */
function bestWordScore(term, words) {
  return words.reduce((best, word) => Math.max(best, typoSimilarity(term, word)), 0);
}

/**
 * Pontua uma mensagem em relação ao input digitado.
 * Retorna -1 se a mensagem não atingir o limiar mínimo.
 */
function scoreSuggestion(input, text) {
  const query    = normalizeText(input);
  const fullText = normalizeText(text);
  if (!query || !fullText) return -1;

  const terms = tokenize(input);
  const words = tokenize(text);
  if (!terms.length || !words.length) return -1;

  let score = 0;
  for (const term of terms) {
    const best = bestWordScore(term, words);
    if (best < fuzzyThreshold(term)) return -1;
    score += best * 100;
    if (words.some(w => w === term))          score += 35;
    else if (words.some(w => w.startsWith(term))) score += 20;
  }

  if (fullText.startsWith(query))       score += 180;
  else if (fullText.includes(query))    score += 70;

  const pos = fullText.indexOf(terms[0]);
  if (pos === 0)    score += 50;
  else if (pos > 0) score += Math.max(0, 25 - pos);

  score -= text.length * 0.03;
  return score;
}

/**
 * Retorna até 5 mensagens ordenadas por relevância para o input digitado.
 */
function getSmartSuggestions(input) {
  return msgs
    .map((msg, index) => {
      const text = applyVars(msg);
      return { index, raw: msg, text, score: scoreSuggestion(input, text) };
    })
    .filter(item => item.score >= 0)
    .sort((a, b) => b.score - a.score || a.text.length - b.text.length)
    .slice(0, 5);
}

/**
 * Atualiza o elemento ghost-text com a parte ainda não digitada da sugestão.
 * O span invisível garante alinhamento pixel-perfect com o input.
 */
function updateGhostText(input, suggestionText) {
  const ghostText = document.getElementById("ghost-text");
  if (!input || !suggestionText || !normalizeText(suggestionText).startsWith(normalizeText(input))) {
    ghostText.innerHTML = "";
    return;
  }
  ghostText.innerHTML =
    `<span style="visibility:hidden">${escapeHtml(suggestionText.substring(0, input.length))}</span>${escapeHtml(suggestionText.substring(input.length))}`;
}

/** Renderiza os chips de sugestão abaixo do input */
function renderSmartSuggestions() {
  const wrap = document.getElementById("smart-suggestions");
  wrap.innerHTML = "";
  currentSuggestions.slice(0, 3).forEach((item, idx) => {
    const btn = document.createElement("button");
    btn.className = "smart-suggestion" + (idx === currentSuggestionIndex ? " active" : "");
    btn.type      = "button";
    btn.title     = item.text;
    btn.textContent = item.text;
    btn.addEventListener("click", () => { currentSuggestionIndex = idx; acceptCurrentSuggestion(); });
    wrap.appendChild(btn);
  });
}

/** Limpa completamente o estado do smart compose */
function clearSmartCompose() {
  const si = document.getElementById("smart-input");
  const gt = document.getElementById("ghost-text");
  const sh = document.getElementById("smart-hint");
  const sw = document.getElementById("smart-suggestions");
  if (si) si.value = "";
  if (gt) gt.innerHTML = "";
  if (sw) sw.innerHTML = "";
  if (sh) sh.classList.remove("visible");
  currentPrediction = ""; currentSuggestions = []; currentSuggestionIndex = 0;
}

/**
 * Completa o campo com a sugestão selecionada, copia para a área de
 * transferência e limpa o campo após breve animação de confirmação.
 */
function acceptCurrentSuggestion() {
  const smartInput = document.getElementById("smart-input");
  const selected   = currentSuggestions[currentSuggestionIndex];
  if (!selected) return;

  currentPrediction   = selected.text;
  smartInput.value    = currentPrediction;

  navigator.clipboard.writeText(currentPrediction).then(() => {
    smartInput.classList.add("copied-flash");
    setTimeout(() => {
      smartInput.classList.remove("copied-flash");
      clearSmartCompose();
    }, 1400);
  });
}

/** Recalcula sugestões e atualiza a UI do smart compose */
function refreshSmartCompose() {
  const smartInput = document.getElementById("smart-input");
  const smartHint  = document.getElementById("smart-hint");
  const input      = smartInput.value.trim();

  if (!input) { clearSmartCompose(); return; }

  currentSuggestions     = getSmartSuggestions(input);
  currentSuggestionIndex = 0;

  if (!currentSuggestions.length) {
    document.getElementById("ghost-text").innerHTML       = "";
    document.getElementById("smart-suggestions").innerHTML = "";
    currentPrediction = "";
    smartHint.classList.remove("visible");
    return;
  }

  currentPrediction = currentSuggestions[0].text;
  updateGhostText(input, currentPrediction);
  renderSmartSuggestions();
  smartHint.classList.add("visible");
}

/**
 * Registra os event listeners do smart compose.
 * Deve ser chamado após load() para que msgs já esteja preenchido.
 */
function initSmartCompose() {
  const smartInput = document.getElementById("smart-input");
  smartInput.addEventListener("input", refreshSmartCompose);
  smartInput.addEventListener("keydown", (e) => {
    if (!currentSuggestions.length) { if (e.key === "Escape") clearSmartCompose(); return; }

    if (e.key === "ArrowRight" || e.key === "ArrowDown") {
      e.preventDefault();
      currentSuggestionIndex = (currentSuggestionIndex + 1) % Math.min(currentSuggestions.length, 3);
      currentPrediction      = currentSuggestions[currentSuggestionIndex].text;
      updateGhostText(smartInput.value.trim(), currentPrediction);
      renderSmartSuggestions();
      return;
    }
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
      e.preventDefault();
      const total = Math.min(currentSuggestions.length, 3);
      currentSuggestionIndex = (currentSuggestionIndex - 1 + total) % total;
      currentPrediction      = currentSuggestions[currentSuggestionIndex].text;
      updateGhostText(smartInput.value.trim(), currentPrediction);
      renderSmartSuggestions();
      return;
    }
    if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); acceptCurrentSuggestion(); return; }
    if (e.key === "Escape") { e.preventDefault(); clearSmartCompose(); }
  });
}

/** Escapa caracteres HTML e preserva espaços no ghost-text */
function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/ /g, "\u00A0");
}

// ═══════════════════════════════════════════════════════════
// PERSISTÊNCIA (localStorage)
// ═══════════════════════════════════════════════════════════

/** Carrega mensagens, tema e nome do atendente do localStorage */
function load() {
  try { msgs = JSON.parse(localStorage.getItem("hd_msgs") || "null") || [...DEFAULTS]; } catch { msgs = [...DEFAULTS]; }
  try { dark = localStorage.getItem("hd_dark") !== "false"; } catch {}
  try { document.getElementById("inp-nome").value = localStorage.getItem("hd_name") || ""; } catch {}
  period = autoDetectPeriod();
}

/** Persiste mensagens e preferência de tema */
function save() {
  localStorage.setItem("hd_msgs", JSON.stringify(msgs));
  localStorage.setItem("hd_dark", String(dark));
}

/** Salva o nome do atendente e atualiza os cards (substitui {{nome}}) */
function salvarNome() {
  localStorage.setItem("hd_name", document.getElementById("inp-nome").value);
  render(true);
}

// ═══════════════════════════════════════════════════════════
// DETECÇÃO AUTOMÁTICA DE PERÍODO
// ═══════════════════════════════════════════════════════════

/** Retorna o período do dia baseado no relógio do sistema */
function autoDetectPeriod() {
  const h = new Date().getHours();
  if (h < 12) return "manha";
  if (h < 18) return "tarde";
  return "noite";
}

// ═══════════════════════════════════════════════════════════
// SUBSTITUIÇÃO DE VARIÁVEIS
// ═══════════════════════════════════════════════════════════

/**
 * Substitui {{nome}} e {{saudacao}} em uma string pelos valores atuais.
 * Usada tanto nos cards quanto no smart compose.
 */
function applyVars(text) {
  const nome = document.getElementById("inp-nome").value || "Suporte";
  const saud = GREETINGS[period] || "Olá";
  return text.replace(/\{\{saudacao\}\}/gi, saud).replace(/\{\{nome\}\}/gi, nome);
}

// ═══════════════════════════════════════════════════════════
// PERÍODO (manhã / tarde / noite)
// ═══════════════════════════════════════════════════════════

/** Define o período ativo e atualiza o destaque dos botões */
function setPeriod(p) {
  period = p;
  ["manha", "tarde", "noite"].forEach(k => {
    document.getElementById("btn-" + k).className =
      "period-btn" + (k === p ? " active-" + k : "");
  });
  render(true);
}

// ═══════════════════════════════════════════════════════════
// TEMA ESCURO / CLARO
// ═══════════════════════════════════════════════════════════

/** Aplica o tema atual ao body e atualiza o ícone do botão */
function applyDark() {
  document.body.classList.toggle("light", !dark);
  const sun  = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
  const moon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
  document.getElementById("icon-dark").innerHTML = dark ? sun : moon;
}

/** Alterna tema e salva preferência */
function toggleDark() { dark = !dark; save(); applyDark(); }

// ═══════════════════════════════════════════════════════════
// CONTROLES DE JANELA (via preload.js → IPC)
// ═══════════════════════════════════════════════════════════

/** Minimiza a janela do Electron */
function minimizar() { if (window.electronAPI) window.electronAPI.minimize(); }

/** Maximiza ou restaura a janela do Electron */
function maximizar() { if (window.electronAPI) window.electronAPI.maximize(); }

/**
 * Calcula a altura ideal baseada no conteúdo e redimensiona a janela.
 * Usa 2 colunas (largura 490px) quando há mais de 5 mensagens.
 * CORREÇÃO: limite máximo era 300 (menor que o mínimo 320) — corrigido para 820.
 */
function resizeWindow() {
  if (!window.electronAPI) return;
  const twoCol = msgs.length > 5;
  const w      = twoCol ? 490 : 360;

  requestAnimationFrame(() => {
    const titlebarEl = document.querySelector(".titlebar");
    const footerEl   = document.querySelector(".footer");
    const listaEl    = document.getElementById("lista");
    if (!titlebarEl || !footerEl || !listaEl) return;

    // Lê a altura real do conteúdo temporariamente fora do flex
    const oldFlex   = listaEl.style.flex;
    const oldHeight = listaEl.style.height;
    listaEl.style.flex   = "none";
    listaEl.style.height = "max-content";
    const contentHeight  = titlebarEl.offsetHeight + footerEl.offsetHeight + listaEl.offsetHeight;
    listaEl.style.flex   = oldFlex;
    listaEl.style.height = oldHeight;

    const h = Math.min(Math.max(contentHeight + 20, 300), 420);
    window.electronAPI.setSize(w, h);
  });
}

// ═══════════════════════════════════════════════════════════
// DRAG AND DROP (reordenação de cards)
// ═══════════════════════════════════════════════════════════

/** Inicia o drag: guarda o índice de origem e anima o card */
function onDragStart(e, i) {
  dragSrc = i;
  dragEl  = e.target.closest(".card");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", String(i));
  setTimeout(() => { if (dragEl) dragEl.classList.add("dragging"); }, 0);
}

/** Finaliza o drag: remove classes de animação */
function onDragEnd() {
  if (dragEl) { dragEl.classList.remove("dragging"); dragEl.classList.remove("shaking"); }
  document.querySelectorAll(".card.drag-over").forEach(c => c.classList.remove("drag-over"));
  dragSrc = null; dragEl = null;
}

/** Marca o card alvo como destino de drop enquanto o cursor passa */
function onCardDragOver(e, i) {
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".card.drag-over").forEach(c => c.classList.remove("drag-over"));
  e.currentTarget.classList.add("drag-over");
}

/** Realiza a troca de posição no array e re-renderiza a lista */
function onCardDrop(e, i) {
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  if (dragSrc === null || dragSrc === i) return;
  const [item] = msgs.splice(dragSrc, 1);
  msgs.splice(i, 0, item);
  dragSrc = null; dragEl = null;
  save(); render();
}

// ═══════════════════════════════════════════════════════════
// RENDERIZAÇÃO DA LISTA PRINCIPAL
// ═══════════════════════════════════════════════════════════

/**
 * Renderiza todos os cards de mensagem no #lista.
 * @param {boolean} skipResize — se true, não chama resizeWindow (evita loop)
 */
function render(skipResize = false) {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  lista.classList.toggle("two-col", msgs.length > 5);

  if (msgs.length === 0) {
    const empty = document.createElement("div");
    empty.className   = "empty";
    empty.textContent = "Nenhuma mensagem. Adicione uma abaixo!";
    lista.appendChild(empty);
    if (!skipResize) resizeWindow();
    return;
  }

  msgs.forEach((msg, i) => {
    const texto = applyVars(msg);
    const div   = document.createElement("div");
    div.className = "card";
    div.setAttribute("ondragover", `onCardDragOver(event,${i})`);
    div.setAttribute("ondrop",     `onCardDrop(event,${i})`);
    div.onclick = (e) => { if (!e.target.closest(".drag-handle")) copiar(texto, div); };
    div.innerHTML = `
      <div class="drag-handle"
          draggable="true"
          ondragstart="onDragStart(event,${i})"
          ondragend="onDragEnd(event)"
          onmousedown="this.closest('.card').classList.add('shaking')"
          onmouseup="this.closest('.card').classList.remove('shaking')"
          onmouseleave="this.closest('.card').classList.remove('shaking')"
          onclick="event.stopPropagation()"
          title="Arrastar para reordenar">${SVG_GRIP}</div>
      <div class="card-text">${texto}</div>
      <div class="copy-icon">${SVG_COPY}</div>`;
    lista.appendChild(div);
  });

  if (!skipResize) resizeWindow();
}

/**
 * Copia o texto para a área de transferência e exibe feedback visual
 * no card (ícone de check + cor de destaque por 1,8s).
 */
function copiar(texto, card) {
  navigator.clipboard.writeText(texto).then(() => {
    card.classList.add("copied");
    card.querySelector(".copy-icon").innerHTML = SVG_CHECK;
    setTimeout(() => {
      card.classList.remove("copied");
      card.querySelector(".copy-icon").innerHTML = SVG_COPY;
    }, 1800);
  });
}

// ═══════════════════════════════════════════════════════════
// MODAL — GERENCIAR MENSAGENS
// ═══════════════════════════════════════════════════════════

/** Abre o modal de mensagens, opcionalmente já em modo "adicionar" */
function abrirModal(comecarAdicionando = false) {
  editIdx = null; addingNew = false;
  document.getElementById("overlay").classList.add("open");
  renderModal();
  if (comecarAdicionando) setTimeout(() => startAddNew(), 50);
}

/** Fecha o modal e reseta o estado de edição */
function fecharModal() {
  document.getElementById("overlay").classList.remove("open");
  editIdx = null; addingNew = false;
}

/** Fecha o modal ao clicar no overlay (fora do card) */
function fecharSeOverlay(e) { if (e.target === e.currentTarget) fecharModal(); }

/** Renderiza a lista de mensagens dentro do modal com botões de edição/exclusão */
function renderModal() {
  const lista = document.getElementById("modal-lista");
  lista.innerHTML = "";

  msgs.forEach((msg, i) => {
    const div = document.createElement("div");
    div.className = "modal-card";

    if (editIdx === i) {
      div.innerHTML = `
        <div style="flex:1">
          <textarea id="edit-ta">${msg}</textarea>
          <div class="edit-actions">
            <button class="edit-btn save" onclick="saveEdit(${i})">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2l11 0 5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Salvar
            </button>
            <button class="edit-btn cancel" onclick="cancelEdit()">Cancelar</button>
          </div>
        </div>`;
      setTimeout(() => {
        const ta = document.getElementById("edit-ta");
        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      }, 30);
    } else {
      div.innerHTML = `
        <div class="modal-card-text">${applyVars(msg)}</div>
        <div class="modal-card-actions">
          <button class="sm-btn" onclick="startEdit(${i})" title="Editar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="sm-btn danger" onclick="deleteMsg(${i})" title="Excluir">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>`;
    }
    lista.appendChild(div);
  });

  if (addingNew) {
    const div = document.createElement("div");
    div.className = "new-card";
    div.innerHTML = `
      <textarea id="new-ta" placeholder="Nova mensagem..."></textarea>
      <div class="edit-actions">
        <button class="edit-btn save" onclick="saveNew()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2l11 0 5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Salvar
        </button>
        <button class="edit-btn cancel" onclick="cancelNew()">Cancelar</button>
      </div>`;
    lista.appendChild(div);
    setTimeout(() => { const ta = document.getElementById("new-ta"); if (ta) ta.focus(); }, 30);
  } else {
    const btn = document.createElement("button");
    btn.className = "add-new-btn";
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nova mensagem`;
    btn.onclick = startAddNew;
    lista.appendChild(btn);
  }
}

function startEdit(i)  { editIdx = i; addingNew = false; renderModal(); }
function cancelEdit()  { editIdx = null; renderModal(); }

/** Salva a edição de uma mensagem existente */
function saveEdit(i) {
  const val = (document.getElementById("edit-ta")?.value || "").trim();
  if (!val) return;
  msgs[i] = val; editIdx = null;
  save(); render(); renderModal();
}

/** Remove uma mensagem pelo índice */
function deleteMsg(i) {
  msgs.splice(i, 1);
  if (editIdx === i) editIdx = null;
  save(); render(); renderModal();
}

function startAddNew() { addingNew = true; editIdx = null; renderModal(); }
function cancelNew()   { addingNew = false; renderModal(); }

/** Adiciona uma nova mensagem ao array e persiste */
function saveNew() {
  const val = (document.getElementById("new-ta")?.value || "").trim();
  if (!val) return;
  msgs.push(val); addingNew = false;
  save(); render(); renderModal();
}

// ═══════════════════════════════════════════════════════════
// MODAL — SOBRE / INFORMAÇÕES
// ═══════════════════════════════════════════════════════════

function abrirInfo()            { document.getElementById("overlay-info").classList.add("open"); }
function fecharInfo()           { document.getElementById("overlay-info").classList.remove("open"); }
function fecharInfoSeOverlay(e) { if (e.target === e.currentTarget) fecharInfo(); }

/** Abre uma URL no navegador padrão do sistema via Electron shell */
function abrirLink(url) {
  if (window.electronAPI) window.electronAPI.openExternal(url);
  else window.open(url, "_blank");
}

// ═══════════════════════════════════════════════════════════
// INICIALIZAÇÃO — a ordem das chamadas é importante
// ═══════════════════════════════════════════════════════════
load();              // 1. carrega dados do localStorage (popula msgs)
applyDark();         // 2. aplica o tema salvo
setPeriod(period);   // 3. destaca o botão do período detectado
render();            // 4. renderiza os cards
initSmartCompose();  // 5. registra listeners do smart compose (após load)
</script>
