<!DOCTYPE html>
<!--
  Hayai Desk — Popup da extensão Chrome
  Home minimalista + gerenciamento de mensagens + backup JSON.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hayai Desk</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --panel:   #181c25;
      --surface: #1e2230;
      --border:  #2a2f42;
      --text:    #e2e6f3;
      --muted:   #6b7394;
      --accent:  #2959fa;
      --accentBg:#08133b;
      --pill:    #252a3a;
      --input:   #111520;
      --danger:  #f87171;
      --success: #22c55e;
      --token-purple: #9d41f3;
      --token-purple-bg: rgba(168,85,247,.12);
      --token-purple-border: rgba(168,85,247,.28);
    }

    body.light {
      --bg:      #f0f2f7;
      --panel:   #ffffff;
      --surface: #f8f9fc;
      --border:  #b4bed1;
      --text:    #1a1d2e;
      --muted:   #8b90aa;
      --accent:  #2959fa;
      --accentBg:#e3e8ff;
      --pill:    #eef0f8;
      --input:   #f8f9fc;
      --danger:  #dc2626;
      --success: #16a34a;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 372px;
      min-height: 260px;
      max-height: 620px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 11px 12px;
      flex-shrink: 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      width: fit-content;
      max-width: fit-content;
      cursor: pointer;
      user-select: none;
      padding: 3px 7px;
      margin-left: -7px;
      margin-right: auto;
      border-radius: 9px;
      transition: background .15s ease, transform .15s ease;
    }

    .logo:hover {
      background: rgba(255,255,255,.045);
    }

    .logo:active {
      transform: scale(.98);
    }

    .about-card {
      gap: 12px;
    }

    .about-main {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 0 2px;
    }

    .about-logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.22), transparent 28%),
        linear-gradient(135deg, rgba(41,89,250,.95), rgba(80,115,255,.72));
      border: 1px solid rgba(120,140,255,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 10px 22px rgba(41,89,250,.25),
        inset 0 1px 0 rgba(255,255,255,.15);
    }

    .about-logo-dot {
      width: 13px;
      height: 13px;
      box-shadow:
        0 0 5px rgba(50,255,114,.85),
        0 0 12px rgba(50,255,114,.45);
    }

    .about-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.02em;
    }

    .about-version {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .about-description {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .about-info-box {
      background:
        linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
      border: 1px solid rgba(120, 140, 190, .16);
      border-radius: 12px;
      padding: 10px;
      box-shadow:
        0 8px 18px rgba(0,0,0,.16),
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    .about-info-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 7px;
      letter-spacing: .04em;
    }

    .about-info-line {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }

    .about-info-line code {
      color: var(--token-purple);
      background: var(--token-purple-bg);
      border: 1px solid var(--token-purple-border);
      padding: 1px 5px;
      border-radius: 5px;
      font-weight: 700;
    }

    .about-footer-text {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .about-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .about-link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      min-height: 38px;
      padding: 9px 11px;

      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;

      background:
        linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
      border: 1px solid rgba(120, 140, 190, .18);
      border-radius: 10px;

      box-shadow:
        0 6px 14px rgba(0, 0, 0, .18),
        inset 0 1px 0 rgba(255,255,255,.055);

      transition:
        transform .14s ease,
        background .14s ease,
        border-color .14s ease,
        box-shadow .14s ease;
    }

    .about-link-btn:hover {
      transform: translateY(-1px);
      background:
        linear-gradient(180deg, rgba(41,89,250,.13), rgba(41,89,250,.055));
      border-color: rgba(80, 115, 220, .42);
      box-shadow:
        0 8px 18px rgba(0, 0, 0, .22),
        0 0 12px rgba(41, 89, 250, .10),
        inset 0 1px 0 rgba(255,255,255,.075);
    }

    .about-link-btn:active {
      transform: translateY(0);
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(41,89,250,.7);
      flex-shrink: 0;
    }

    .logo-name {
      font-size: 14px;
      font-weight: 750;
      color: var(--text);
      letter-spacing: -.01em;
    }

    .logo-version {
      font-size: 10px;
      color: var(--muted);
      margin-left: 2px;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      flex-shrink: 0;
    }

    .icon-btn:hover { background: var(--pill); color: var(--text); }

    .app {
      overflow-y: auto;
      padding: 10px;
      flex: 1;
    }

    .app::-webkit-scrollbar { width: 4px; }
    .app::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    .hero-card,
    .panel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .status-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #a9b9ff;
      background: rgba(41,89,250,.12);
      border: 1px solid rgba(41,89,250,.28);
      border-radius: 999px;
      padding: 4px 8px;
      white-space: nowrap;
    }
    
    .smart-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .smart-status-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #a9b9ff;
      background: rgba(41,89,250,.12);
      border: 1px solid rgba(41,89,250,.28);
      border-radius: 999px;
      padding: 5px 8px;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #32ff72;
      box-shadow:
        0 0 4px rgba(50,255,114,.85),
        0 0 9px rgba(50,255,114,.55),
        0 0 16px rgba(50,255,114,.28);
    }

    .status-pill.off .status-dot {
      background: #ff4d57;
      box-shadow:
        0 0 4px rgba(255,77,87,.75),
        0 0 9px rgba(255,77,87,.48),
        0 0 16px rgba(255,77,87,.25);
    }

    .status-pill.off {
      color: #cfd5e6;
      border-color: rgba(255,90,100,.22);
      background: rgba(255,77,87,.08);
    }

    .ios-switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }

    .ios-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .ios-slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: rgba(140, 150, 170, .28);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      transition: .22s ease;
      box-shadow:
        inset 0 1px 2px rgba(0,0,0,.25),
        0 4px 10px rgba(0,0,0,.12);
    }

    .ios-slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 1px;
      top: 1px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffffff 0%, #e9edf7 100%);
      box-shadow:
        0 2px 8px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.85);
      transition: .22s ease;
    }

    .ios-switch input:checked + .ios-slider {
      background: linear-gradient(180deg, rgba(50,255,114,.92), rgba(25,212,84,.86));
      border-color: rgba(50,255,114,.28);
      box-shadow:
        0 0 10px rgba(50,255,114,.22),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    .ios-switch input:checked + .ios-slider::before {
      transform: translateX(18px);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 7px rgba(34,197,94,.55);
    }

    .help-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 10px 0 12px;
    }

    .help-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    code {
      color: var(--token-purple);
      background: var(--token-purple-bg);
      border: 1px solid var(--token-purple-border);
      padding: 1px 5px;
      border-radius: 5px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 12px;
    }

    .stat-box {
      background: rgba(255,255,255,.025);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }

    .stat-label {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn,
    .btn-primary,
    .btn-ghost,
    .btn-danger {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition:
        transform .14s ease,
        background .14s ease,
        border-color .14s ease,
        box-shadow .14s ease,
        opacity .14s ease;
      min-height: 36px;
      position: relative;
      overflow: hidden;
    }

    /* Botão principal: mais profundidade */
    .btn-primary {
      background: linear-gradient(180deg, #3b63ff 0%, #2959fa 100%);
      border-color: rgba(90, 120, 255, .78);
      color: #fff;
      box-shadow:
        0 8px 18px rgba(41, 89, 250, .26),
        inset 0 1px 0 rgba(255, 255, 255, .14),
        inset 0 -1px 0 rgba(0, 0, 0, .16);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      border-color: rgba(125, 150, 255, .9);
      box-shadow:
        0 10px 22px rgba(41, 89, 250, .34),
        inset 0 1px 0 rgba(255, 255, 255, .18),
        inset 0 -1px 0 rgba(0, 0, 0, .16);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow:
        0 5px 12px rgba(41, 89, 250, .22),
        inset 0 1px 2px rgba(0, 0, 0, .20);
    }

    /* Botões secundários: vidro discreto */
    .btn-ghost {
      background:
        linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
      color: var(--text);
      border-color: rgba(120, 140, 190, .18);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, .18),
        inset 0 1px 0 rgba(255, 255, 255, .055);
    }

    .btn-ghost:hover {
      transform: translateY(-1px);
      background:
        linear-gradient(180deg, rgba(41,89,250,.13), rgba(41,89,250,.055));
      border-color: rgba(80, 115, 220, .42);
      box-shadow:
        0 8px 18px rgba(0, 0, 0, .22),
        0 0 12px rgba(41, 89, 250, .10),
        inset 0 1px 0 rgba(255, 255, 255, .075);
    }

    .btn-ghost:active {
      transform: translateY(0);
      box-shadow:
        0 4px 10px rgba(0, 0, 0, .18),
        inset 0 1px 2px rgba(0, 0, 0, .18);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: rgba(248,113,113,.32);
    }

    .backup-row {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section-label {
      margin: 12px 0 7px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .manager-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .manager-title {
      flex: 1;
      font-size: 13px;
      font-weight: 800;
    }

    .search-input {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      margin-bottom: 8px;
    }

    .search-input:focus { border-color: rgba(41,89,250,.6); }
    .search-input::placeholder { color: var(--muted); }

    .list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .msg-card,
    .new-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .msg-text {
      flex: 1;
      font-size: 12px;
      color: var(--text);
      line-height: 1.45;
      max-height: 54px;
      overflow: hidden;
    }

    .msg-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .sm-btn {
      width: 27px;
      height: 27px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .12s;
    }

    .sm-btn:hover { background: var(--pill); color: var(--text); }
    .sm-btn.danger { border-color: rgba(248,113,113,.34); color: var(--danger); }
    .sm-btn.danger:hover { background: rgba(248,113,113,.1); }

    textarea {
      width: 100%;
      background: var(--input);
      border: 1px solid rgba(41,89,250,.35);
      border-radius: 8px;
      padding: 8px 9px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      resize: vertical;
      min-height: 70px;
      font-family: inherit;
      line-height: 1.45;
    }

    .form-wrap { flex: 1; }

    .form-actions {
      display: flex;
      gap: 6px;
      margin-top: 7px;
    }

    .form-actions .btn-primary,
    .form-actions .btn-ghost {
      flex: 1;
      min-height: 32px;
      padding: 6px 9px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 22px 0;
    }

    .manager-footer {
      position: sticky;
      bottom: -10px;
      background: linear-gradient(to top, var(--bg) 72%, transparent);
      padding-top: 10px;
      margin-top: 8px;
    }

    svg { display: block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-row">
      <div class="logo">
        <span class="logo-dot"></span>
        <span class="logo-name">Hayai Desk</span>
        <span class="logo-version">v2.0</span>
      </div>
      <button class="icon-btn" id="btn-dark" title="Alternar tema" type="button">
        <svg id="icon-dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>
  </header>

  <main class="app" id="app"></main>

  <input type="file" id="import-file" class="hidden" accept="application/json,.json">

  <script src="popup.js"></script>
</body>
</html>
